server:
  port: ${PORT:8085}

spring:
  application:
    name: ivixhub-api

  datasource:
    url: ${IVIXHUB_DB_URL:jdbc:postgresql://localhost:5434/ivixhub}
    username: ${IVIXHUB_DB_USER:ivixhub}
    password: ${IVIXHUB_DB_PASS:ivixhub_pass}
    driver-class-name: org.postgresql.Driver

  # ✅ dev тоже живёт на миграциях, иначе каталоги/валидации ломаются
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ✅ hibernate не должен “сам” менять схему, только проверка
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

ivixhub:
  security:
    jwt:
      secret: ${IVIXHUB_JWT_SECRET:CHANGE_ME__PLEASE_USE_A_LONG_RANDOM_SECRET_32+_CHARS}
      accessMinutes: ${IVIXHUB_JWT_ACCESS_MINUTES:60}
      refreshDays: ${IVIXHUB_JWT_REFRESH_DAYS:30}

  storage:
    local:
      rootDir: ${IVIXHUB_STORAGE_ROOT:/home/garos/ivixhub/storage}

