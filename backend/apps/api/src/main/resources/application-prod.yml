server:
  port: ${PORT:8085}

spring:
  application:
    name: ivixhub-api

  main:
    lazy-initialization: true

  datasource:
    url: jdbc:postgresql://${PGHOST_UNPOOLED}:5432/${PGDATABASE}?sslmode=require
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      initialization-fail-timeout: -1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        format_sql: false

  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    am.ivixhub: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.type.descriptor.sql: WARN

ivixhub:
  security:
    jwt:
      secret: ${IVIXHUB_JWT_SECRET}
      accessMinutes: ${IVIXHUB_JWT_ACCESS_MINUTES:15}
      refreshDays: ${IVIXHUB_JWT_REFRESH_DAYS:30}

  storage:
    local:
      rootDir: ${IVIXHUB_STORAGE_ROOT:/var/lib/ivixhub/storage}
