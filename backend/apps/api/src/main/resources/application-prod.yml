server:
  port: ${PORT:8085}

spring:
  application:
    name: ivixhub-api

  main:
    lazy-initialization: true

  datasource:
    url: jdbc:postgresql://${PGHOST_UNPOOLED}:5432/${PGDATABASE}?sslmode=require
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

ivixhub:
  security:
    jwt:
      secret: ${IVIXHUB_JWT_SECRET}
      accessMinutes: ${IVIXHUB_JWT_ACCESS_MINUTES:15}
      refreshDays: ${IVIXHUB_JWT_REFRESH_DAYS:30}

  storage:
    local:
      rootDir: ${IVIXHUB_STORAGE_ROOT:/var/lib/ivixhub/storage}
